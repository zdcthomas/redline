[package]
name = "redline"
version = "0.2.0"
edition = "2024"
description = "Keyboard-driven TUI spec editor: humans write, agents suggest"

[workspace]
members = [".", "app"]
default-members = ["."]

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
portable-pty = "0.9"
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
unicode-width = "0.2"
vt100 = "0.18"

[profile.release]
lto = "thin"
strip = true
